<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000"><meta name="mobile-web-app-capable" content="yes"><link rel="manifest" href="./manifest.json"><link rel="icon" href="./icon-192.png"><title>MSABA Smart Display</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden;font-family:Arial,sans-serif}#display{position:fixed;inset:0;width:100%;height:100%;border:0;background:#000}.cover{position:fixed;inset:0;z-index:20;background:#050805;color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;transition:opacity .4s}.hide{opacity:0;pointer-events:none}.logo{width:min(34vw,230px);max-height:38vh;object-fit:contain}h1{font-size:clamp(24px,4vw,46px);margin:16px 0 8px}p{color:#aaa;line-height:1.5}.spin{width:38px;height:38px;border:4px solid #333;border-top-color:#e8c55d;border-radius:50%;margin:22px auto;animation:s .9s linear infinite}@keyframes s{to{transform:rotate(360deg)}}</style></head><body>
<iframe id="display" src="https://script.google.com/macros/s/AKfycbyPomsJrKK3XYeaigyLI_y5MFHiR1EiK_wx5pKSw4GDkKLv-NFEnBHG00RfQEEjLvq8/exec" allow="autoplay; fullscreen" allowfullscreen></iframe>
<div id="splash" class="cover"><div><img class="logo" src="./icon-512.png"><h1>MSABA SMART DISPLAY</h1><p>Masjid Saidina Abu Bakar As-Siddiq, Bangsar</p><div class="spin"></div></div></div>
<div id="offline" class="cover hide"><div><img class="logo" src="./icon-512.png"><h1>SAMBUNGAN INTERNET TERPUTUS</h1><p>Sistem sedang menunggu Internet.<br>Smart Display akan bersambung semula secara automatik.</p><div class="spin"></div></div></div>
<script>
const U="https://script.google.com/macros/s/AKfycbyPomsJrKK3XYeaigyLI_y5MFHiR1EiK_wx5pKSw4GDkKLv-NFEnBHG00RfQEEjLvq8/exec",f=document.getElementById('display'),s=document.getElementById('splash'),o=document.getElementById('offline');
f.addEventListener('load',()=>setTimeout(()=>s.classList.add('hide'),650));setTimeout(()=>s.classList.add('hide'),12000);
function off(){o.classList.remove('hide')} function reload(){o.classList.add('hide');f.src=U+(U.includes('?')?'&':'?')+'_v42='+Date.now()}
addEventListener('offline',off);addEventListener('online',reload);if(!navigator.onLine)off();
setInterval(()=>{if(navigator.onLine&&!o.classList.contains('hide'))reload()},30000);
let wl;async function wake(){try{if('wakeLock'in navigator&&document.visibilityState==='visible')wl=await navigator.wakeLock.request('screen')}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')wake()});wake();
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js'));
</script></body></html>
