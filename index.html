<!doctype html>
<html lang="ms"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="./manifest.json"><link rel="icon" href="./icon-192.png"><link rel="apple-touch-icon" href="./icon-192.png">
<title>MSABA Smart Display</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden;font-family:Arial,sans-serif}#display{position:fixed;inset:0;width:100%;height:100%;border:0;background:#000}#loading{position:fixed;inset:0;z-index:10;background:#050805;color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;transition:opacity .45s}#loading.hide{opacity:0;pointer-events:none}.logo{width:min(34vw,230px);max-height:38vh;object-fit:contain}h1{margin:16px 0 8px;font-size:clamp(24px,4vw,46px)}p{margin:0;color:#aaa}.spinner{width:38px;height:38px;border:4px solid #333;border-top-color:#e8c55d;border-radius:50%;margin:22px auto 0;animation:spin .9s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}</style>
</head><body>
<iframe id="display" src="https://script.google.com/macros/s/AKfycbyPomsJrKK3XYeaigyLI_y5MFHiR1EiK_wx5pKSw4GDkKLv-NFEnBHG00RfQEEjLvq8/exec" title="MSABA Smart Display" allow="autoplay; fullscreen" allowfullscreen></iframe>
<div id="loading"><div><img class="logo" src="./icon-512.png" alt="MSABA"><h1>MSABA SMART DISPLAY</h1><p>Masjid Saidina Abu Bakar As-Siddiq, Bangsar</p><div class="spinner"></div></div></div>
<script>
const f=document.getElementById('display'),l=document.getElementById('loading');
f.addEventListener('load',()=>setTimeout(()=>l.classList.add('hide'),700));
setTimeout(()=>l.classList.add('hide'),12000);
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js'));
</script></body></html>
